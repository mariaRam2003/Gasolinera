<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Sistema de gestión para gasolinera: ventas, precios y cortes."
    />
    <title>Gasolinera · Panel de gestión</title>
    <link rel="icon" href="gasolinera.ico" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">⛽</div>
          <div>
            <span class="eyebrow">GESTIÓN</span>
            <h1>Gasolinera</h1>
          </div>
        </div>
        <div class="connection-status" id="connection-status">
          <span class="status-dot"></span>
          <span>Conectando…</span>
        </div>
      </header>

      <main class="container">
        <nav class="tabs" aria-label="Secciones">
          <button class="tab is-active" data-tab="vender">
            ⛽ <span>Vender</span>
          </button>
          <button class="tab" data-tab="precios">
            🏷️ <span>Precios</span>
          </button>
          <button class="tab" data-tab="corte">📋 <span>Corte</span></button>
        </nav>

        <section id="view" aria-live="polite"></section>
      </main>

      <footer class="footer">
        <span>Gasolinera · Sistema de gestión</span>
        <span>® Pylot Labs 2026</span>
        <span>America/Guatemala</span>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
